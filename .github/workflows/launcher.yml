name: Launcher
'on':
  push:
    branches: ['**']
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: make release-version-check VERSION="$RELEASE_VERSION"
      - name: Verify tagged main and its commit CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          head="$(git rev-parse HEAD)"
          main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$main" || { printf '%s\n' 'Tag must point to the current main commit' >&2; exit 1; }
          make release-ci-wait RELEASE_REF=main
          main="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$head" = "$main" || { printf '%s\n' 'main changed while checking commit CI' >&2; exit 1; }
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="dev-$SOURCE_SHA"
          if [ "$REF_TYPE" = tag ]; then version="$REF_NAME"; fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          WORKFLOW_IMAGE: ${{ vars.TOOLING_IMAGE || 'ghcr.io/voxpupuli/voxbox:10.1.0-openvox8@sha256:01bb8ce5e24d5b111934660f75e2786b4d7c7adcaa7518a564856d1d3041d10d' }}
        run: make build VERSION="$BUILD_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pmtool-${{ steps.version.outputs.version }}
          path: dist/${{ steps.version.outputs.version }}/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pmtool-${{ github.ref_name }}
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$RELEASE_TAG" release/* --draft --verify-tag --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
